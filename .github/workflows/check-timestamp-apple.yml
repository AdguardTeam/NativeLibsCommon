name: Check timestamp.apple.com availability

on:
  pull_request:

permissions:
  contents: read

env:
  # The URL codesign actually uses. It is not baked into codesign itself: the
  # default comes from the Security framework's TimeStampingPrefs.plist
  # (ServerURL key), and the request is issued by XPCTimeStampingService.xpc.
  TSA_URL: http://timestamp.apple.com/ts01
  # User-Agent of the process that really issues the request, for parity with
  # codesign (CFNetwork/Darwin versions differ per host, that is fine).
  TSA_UA: XPCTimeStampingService/50001 CFNetwork/3826.600.41.1.1 Darwin/24.6.0

jobs:
  resolve-images:
    name: Resolve build image labels
    if: github.repository == 'AdGuardSoftwareLimited/native-libs-common'
    runs-on: [team-corelibs]
    outputs:
      macos: ${{ steps.kv.outputs.MACOS }}
    steps:
      - name: Resolve image labels from cistate
        id: kv
        uses: AdGuardSoftwareLimited/actions/actions/kv-multi@master
        with:
          get: |
            MACOS=build-images/macos

  check:
    name: Probe Apple timestamp authority
    needs: resolve-images
    runs-on: ${{ fromJSON(format('["ephemeral","ephemeral-mac","{0}","ephemeral-limit-memory-6144","ephemeral-limit-cpu-4"]', needs.resolve-images.outputs.macos)) }}
    steps:
      - name: Show network configuration
        run: |
          set -x
          ifconfig || true
          scutil --dns || true
          netstat -rn || true
          dig +short timestamp.apple.com A || true
          dig +short timestamp.apple.com AAAA || true

      - name: Build an RFC 3161 timestamp query
        run: |
          set -eux
          # Byte-for-byte the shape codesign sends, as captured from a real
          # signing run: SHA-256 imprint, nonce, certReq = true and reqPolicy
          # 1.2.3.4.5.6. The system LibreSSL supports `openssl ts`.
          echo "native-libs-common tsa probe ${GITHUB_RUN_ID}" > probe.bin
          /usr/bin/openssl ts -query -data probe.bin -sha256 -cert \
            -policy 1.2.3.4.5.6 -out probe.tsq
          /usr/bin/openssl ts -query -in probe.tsq -text

          cat > probe.sh <<'SH'
          #!/bin/bash
          # $1 = curl address-family option ('' | -4 | -6), $2 = tag
          set -eux
          curl -fsS ${1:+"$1"} --max-time 30 \
            -H 'Content-Type: application/timestamp-query' \
            -H "User-Agent: ${TSA_UA}" \
            --data-binary @probe.tsq \
            -w 'http=%{http_code} ip=%{remote_ip} size=%{size_download}\n' \
            -o "reply-$2.tsr" "${TSA_URL}"
          /usr/bin/openssl ts -reply -in "reply-$2.tsr" -text
          # A reachable-but-broken TSA still answers 200, so require a grant.
          /usr/bin/openssl ts -reply -in "reply-$2.tsr" -text | grep -q 'Status: Granted'
          SH
          chmod +x probe.sh

      # Each probe keeps going on failure so that all outcomes show up in one
      # run; the summary step at the end fails the job if any of them broke.
      - name: POST timestamp query (default)
        id: post_default
        continue-on-error: true
        run: ./probe.sh '' default

      - name: POST timestamp query (-4)
        id: post_ipv4
        continue-on-error: true
        run: ./probe.sh -4 ipv4

      - name: POST timestamp query (-6)
        id: post_ipv6
        continue-on-error: true
        run: ./probe.sh -6 ipv6

      - name: Plain GET on the bare host (informational)
        id: get_root
        continue-on-error: true
        run: |
          set -x
          # The bare host answers 302 -> www.apple.com/certificateauthority/ for
          # any GET, so this says nothing about the TSA itself. -f turns that 302
          # into a real failure instead of a silent "success".
          for opt in '' -4 -6; do
            curl -fsSv ${opt:+"$opt"} --max-time 30 -o /dev/null http://timestamp.apple.com/
          done

      - name: Summary
        run: |
          {
            echo '| Probe | Outcome |'
            echo '| --- | --- |'
            echo "| POST ${TSA_URL} (default) | ${{ steps.post_default.outcome }} |"
            echo "| POST ${TSA_URL} (-4) | ${{ steps.post_ipv4.outcome }} |"
            echo "| POST ${TSA_URL} (-6) | ${{ steps.post_ipv6.outcome }} |"
            echo '| GET http://timestamp.apple.com/ (informational) | ${{ steps.get_root.outcome }} |'
          } >> "$GITHUB_STEP_SUMMARY"

          [ '${{ steps.post_default.outcome }}' = success ] \
            && [ '${{ steps.post_ipv4.outcome }}' = success ] \
            && [ '${{ steps.post_ipv6.outcome }}' = success ]
