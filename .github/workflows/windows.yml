name: windows

on:
  pull_request:

jobs:
  resolve-images:
    if: github.repository == 'AdGuardSoftwareLimited/native-libs-common'
    uses: ./.github/workflows/resolve-images.yml

  licensing-status:
    if: github.repository == 'AdGuardSoftwareLimited/native-libs-common'
    needs: resolve-images
    runs-on: ${{ fromJSON(format('["ephemeral","ephemeral-vmwin","{0}","ephemeral-limit-memory-4096","ephemeral-limit-cpu-4"]', needs.resolve-images.outputs.windows)) }}
    steps:
      - name: Show Windows licensing status
        shell: powershell
        run: |
          Get-CimInstance SoftwareLicensingProduct |
            Where-Object { $_.LicenseStatus -eq 1 } |
            Select-Object Description, GracePeriodRemaining
