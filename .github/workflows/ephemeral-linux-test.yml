name: Ephemeral Linux test

# Run two ephemeral Linux jobs on the debian13-github image — each idling for
# two minutes and then quitting, to check the ephemeral agents come up and tear
# down cleanly.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  idle:
    name: Idle ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        name: [one, two]
    runs-on:
      - ephemeral
      - ephemeral-linux
      - registry.int.agrd.dev/linux/debian13-github:20260816-2356
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Idle for two minutes
        shell: bash
        run: |
          set -eux
          echo "runner image: registry.int.agrd.dev/linux/debian13-github:20260816-2356"
          echo "job: ${{ matrix.name }}, run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sleep 120
          echo "done"
