name: Ephemeral Linux test

# Run one ephemeral job inside a container on the corelibs-builder image
# (resolved from the KV store), sleeping five minutes — enough time to attach to
# the live agent and inspect the container network.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  resolve-images:
    uses: ./.github/workflows/resolve-images.yml

  sleep:
    name: Sleep in container
    needs: resolve-images
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ needs.resolve-images.outputs.corelibs-builder }}
      - ephemeral-limit-memory-2048
      - ephemeral-limit-cpu-2
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Sleep five minutes
        shell: bash
        run: |
          set -eux
          echo "runner image: ${{ needs.resolve-images.outputs.corelibs-builder }}"
          sleep 300
          echo done
