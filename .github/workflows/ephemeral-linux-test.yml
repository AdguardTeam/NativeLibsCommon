name: Ephemeral Linux test

# Run two ephemeral Linux jobs on the corelibs-builder image — resolved by the
# resolve-images reusable workflow — each idling for two minutes and then
# quitting, to check the ephemeral agents come up and tear down cleanly.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  resolve-images:
    uses: ./.github/workflows/resolve-images.yml

  idle:
    name: Idle ${{ matrix.name }}
    needs: resolve-images
    strategy:
      fail-fast: false
      matrix:
        name: [one, two]
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ needs.resolve-images.outputs.corelibs-builder }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Idle for two minutes
        shell: bash
        run: |
          set -eux
          echo "runner image: ${{ needs.resolve-images.outputs.corelibs-builder }}"
          echo "job: ${{ matrix.name }}, run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          sleep 120
          echo "done"
