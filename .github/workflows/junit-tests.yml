# Local copy of AdGuardSoftwareLimited/actions/.github/workflows/junit-tests.yml
# extended with optional sccache steps (sccache-key input). Keep in sync with
# upstream: merge the sccache changes back into actions when convenient.
name: JUnit tests

on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: true
        description: 'JSON array of runner labels'
      container-image:
        type: string
        default: ''
        description: 'Docker image for the job container. Empty string = no container (e.g. macOS runners)'
      vault-role:
        type: string
        default: ''
        description: 'Vault JWT auth role name. Empty = skip Vault step'
      vault-secrets:
        type: string
        default: ''
        description: 'Vault secrets specification (multi-line, vault-action format). Secrets are exported as env vars. Empty = skip Vault step'
      prepare-script:
        type: string
        default: ''
        description: 'Shell commands to run after checkout (e.g. keystore setup). Vault secrets are available as env vars. Empty = skip'
      test-command:
        type: string
        required: true
        description: 'Shell command to run unit tests (e.g. ./gradlew testDebugUnitTest)'
      finally-script:
        type: string
        default: ''
        description: 'Shell commands to run after tests complete (always, even on failure). Use for cache uploads, cleanup, etc.'
      results-path:
        type: string
        required: true
        description: 'Glob pattern for JUnit XML test results'
      artifact-name:
        type: string
        default: 'unit-test-results'
        description: 'Name for the uploaded test results artifact'
      shell:
        type: string
        default: 'bash'
        description: 'Shell interpreter for prepare-script and test-command (e.g. bash, powershell, pwsh)'
      sccache-key:
        type: string
        default: ''
        description: >
          Registry-cache key for the sccache store. Empty = skip the sccache
          steps entirely. When set:
          - the store is restored into $GITHUB_WORKSPACE/.sccache before the
            tests, so it lands inside the docker context (COPY . . seeds the
            container);
          - the caller's build must export the store out of the container
            into `sccache-path` (e.g. an output stage that copies /sccache
            into the output dir);
          - after the build the store is read from `sccache-path` (stats)
            and saved back to the registry under this key.
      sccache-path:
        type: string
        default: 'build/sccache'
        description: >
          Path (relative to the workspace) where the docker build exports the
          sccache store to; the stats and save steps read it from here. The
          caller's output stage must write the store to this path. Restore, in
          contrast, always writes into $GITHUB_WORKSPACE/.sccache so the store
          is part of the build context.
      sccache-stats-path:
        type: string
        default: 'build/sccache-stats.json'
        description: >
          Path (relative to the workspace) of the sccache counters captured by
          the docker build (sccache --show-stats --stats-format=json). The
          stats step reads them from here to decide whether to force-save the
          store: the runner-side daemon never sees the container's
          compilations and would report all zeros. A job that compiles on the
          runner itself (no docker) leaves this file absent, and the daemon is
          queried directly instead. A human-readable file with the same name
          but a .txt extension (e.g. build/sccache-stats.txt) is printed to the
          log when present.
    secrets:
      test-env:
        required: false
        description: 'Multi-line KEY=VALUE pairs exported as masked env vars before prepare-script and test-command. Use with `secrets: inherit` on the caller side.'
      sccache-config:
        required: false
        description: 'Auth config for the registry-cache restore/save actions (REGISTRY_CACHE_AUTH). Required when sccache-key is set.'
permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ${{ fromJson(inputs.runs-on) }}
    container: ${{ inputs.container-image || null }}
    defaults:
      run:
        shell: ${{ inputs.shell || 'bash' }}
    env:
      # sccache local-disk store, restored/saved across runs by the
      # registry-cache action as an OCI registry blob. Only used when
      # sccache-key is set.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 512M
    steps:
      - name: Fetch secrets from Vault
        if: inputs.vault-role != ''
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_URL }}
          method: jwt
          path: jwt
          role: ${{ inputs.vault-role }}
          secrets: ${{ inputs.vault-secrets }}

      - name: Checkout repository
        uses: actions/checkout@v5

      # sccache wraps the compilers so objects are reused across runs; the store
      # is restored into $GITHUB_WORKSPACE/.sccache and read back from sccache-path.
      - name: Configure sccache
        if: inputs.sccache-key != ''
        uses: AdguardTeam/sccache-action@main

      # Bound the restore and keep it non-fatal: the action turns its own errors
      # into a "miss", but a stalled registry connection hangs the step.
      - name: Restore sccache store
        if: inputs.sccache-key != ''
        continue-on-error: true
        timeout-minutes: 5
        uses: AdGuardSoftwareLimited/actions/actions/registry-cache/restore@master
        with:
          config: ${{ secrets.sccache-config }}
          key: ${{ inputs.sccache-key }}
          path: ${{ env.SCCACHE_DIR }}

      - name: Apply PR overrides
        uses: AdGuardSoftwareLimited/actions/actions/apply-pr-overrides@master

      - name: Export extra environment variables
        uses: actions/github-script@v8
        env:
          _TEST_ENV: ${{ secrets.test-env }}
        with:
          script: |
            const fs = require('fs');
            const raw = process.env._TEST_ENV || '';
            if (!raw.trim()) return;
            for (const line of raw.split('\n')) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith('#')) continue;
              const idx = trimmed.indexOf('=');
              if (idx < 1) continue;
              const value = trimmed.substring(idx + 1);
              core.setSecret(value);
              fs.appendFileSync(process.env.GITHUB_ENV, trimmed + '\n');
            }

      - name: Prepare environment
        if: inputs.prepare-script != ''
        run: ${{ inputs.prepare-script }}

      - name: Run unit tests
        run: ${{ inputs.test-command }}

      - name: Finally
        if: always() && inputs.finally-script != ''
        run: ${{ inputs.finally-script }}

      # force=true when sccache wrote new entries this run: the save action skips
      # the upload while the key exists, so the store would otherwise freeze.
      - name: sccache stats
        id: sccache-stats
        # The script below is bash; a caller that sets `shell: powershell` gets
        # the PowerShell variant of this step instead (see right after it).
        if: always() && inputs.sccache-key != '' && inputs.shell != 'powershell' && inputs.shell != 'pwsh'
        run: |
          # A docker build exports the counters it captured (the runner daemon
          # would report zeros); a runner-side build is queried directly.
          stats_file="${{ inputs.sccache-stats-path }}"
          if [ -f "$stats_file" ]; then
            cat "${stats_file%.json}.txt" 2>/dev/null || true
            cache_writes=$(grep -o '"cache_writes":[0-9]*' "$stats_file" 2>/dev/null \
              | grep -o '[0-9]*' || echo 0)
          else
            SCCACHE_DIR=${{ inputs.sccache-path }} sccache --show-stats || true
            cache_writes=$(SCCACHE_DIR=${{ inputs.sccache-path }} sccache --show-stats --stats-format=json 2>/dev/null \
              | grep -o '"cache_writes":[0-9]*' | grep -o '[0-9]*' || echo 0)
          fi
          if [ "$cache_writes" -gt 0 ] 2>/dev/null; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      # PowerShell twin of the step above: the caller's shell (e.g. the
      # Windows runner's `shell: powershell`) applies to every `run:` step in
      # this job, so the bash script would fail with syntax errors there.
      - name: sccache stats (PowerShell)
        id: sccache-stats-pwsh
        if: always() && inputs.sccache-key != '' && (inputs.shell == 'powershell' || inputs.shell == 'pwsh')
        run: |
          $ErrorActionPreference = 'Continue'

          # A docker build exports the counters it captured (the runner daemon
          # would report zeros); a runner-side build is queried directly.
          $statsFile = '${{ inputs.sccache-stats-path }}'
          $cacheWrites = 0
          if (Test-Path -LiteralPath $statsFile) {
            $txtFile = $statsFile -replace '\.json$', '.txt'
            if (Test-Path -LiteralPath $txtFile) { Get-Content -LiteralPath $txtFile }
            try {
              $cacheWrites = [int]((Get-Content -LiteralPath $statsFile -Raw | ConvertFrom-Json).stats.cache_writes)
            } catch {
              $cacheWrites = 0
            }
          } else {
            $env:SCCACHE_DIR = '${{ inputs.sccache-path }}'
            & sccache --show-stats
            $json = (& sccache --show-stats --stats-format=json 2>$null) -join "`n"
            if ($json -and $json.Trim()) {
              try {
                $cacheWrites = [int](($json | ConvertFrom-Json).stats.cache_writes)
              } catch {
                $cacheWrites = 0
              }
            }
          }
          if ($cacheWrites -gt 0) {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'force=true'
          } else {
            Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'force=false'
          }
          # A non-zero exit code of the query above must not fail the step.
          $LASTEXITCODE = 0

      - name: Save sccache store
        if: always() && inputs.sccache-key != ''
        uses: AdGuardSoftwareLimited/actions/actions/registry-cache/save@master
        with:
          config: ${{ secrets.sccache-config }}
          key: ${{ inputs.sccache-key }}
          path: ${{ inputs.sccache-path }}
          force: ${{ steps.sccache-stats.outputs.force || steps.sccache-stats-pwsh.outputs.force }}

      - name: JUnit summary
        if: always()
        uses: AdGuardSoftwareLimited/actions/actions/junit-summary@master
        with:
          path: ${{ inputs.results-path }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.results-path }}
          if-no-files-found: error
