name: Run tests

on:
  push:
    branches:
      - master
      - 'stable-*'
      - 'dev-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Image used for the containerized Linux and Android builds on `team-corelibs`.
  CORELIBS_IMAGE: adguard/core-libs:2.12

jobs:
  resolve-images:
    if: github.repository == 'AdGuardSoftwareLimited/native-libs-common'
    uses: ./.github/workflows/resolve-images.yml

  tests:
    name: ${{ matrix.name }} build
    if: github.repository == 'AdGuardSoftwareLimited/native-libs-common'
    needs: resolve-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Win
            runs-on: '["ephemeral","ephemeral-vmwin","${{ needs.resolve-images.outputs.windows }}","ephemeral-limit-memory-4096","ephemeral-limit-cpu-4"]'
            container-image: ''
            shell: powershell
            artifact-name: test-results-windows
            results-path: 'cmake-build-msvc-debug/junit.xml'
            sccache-key: sccache-windows-${{ hashFiles('conanfile.py') }}
            test-command: |
              $ErrorActionPreference = 'Stop'

              # Windows runners ship no make of their own.
              & choco install make -y --no-progress
              if (!$?) { exit 1 }

              & conan remote add --index 0 art ${{ vars.CONAN_REPO_URL }}

              # Tests are built for 32-bit x86, so use the cross toolchain env.
              cmd /c "vcvarsamd64_x86 & set" | ForEach-Object {
                if ($_ -match "=") {
                  $v = $_.split("=", 2)
                  Set-Item -Force -Path "ENV:\$($v[0])" -Value $v[1]
                }
              }

              & make PRESET=msvc-debug test CMAKE_LAUNCHER=sccache
              if (!$?) { exit 1 }
            finally-script: |
              $ErrorActionPreference = 'Continue'

              & conan remote login art "$env:ARTIFACTORY_USER" --password "$env:ARTIFACTORY_API_KEY"
              & conan upload -r art -c "*" 2>&1 | Select-String "Uploading" -SimpleMatch
          - name: Mac
            runs-on: '["ephemeral","ephemeral-mac","${{ needs.resolve-images.outputs.macos }}","ephemeral-limit-memory-6144","ephemeral-limit-cpu-4"]'
            container-image: ''
            shell: bash
            artifact-name: test-results-macos
            results-path: 'cmake-build-clang-debug/junit.xml'
            sccache-key: sccache-macos-${{ hashFiles('conanfile.py') }}
            test-command: |
              set -eux

              rm -rf venv
              python3 -m venv venv
              source ./venv/bin/activate

              python3 -m pip install conan
              conan remote add --index 0 art ${{ vars.CONAN_REPO_URL }} || true

              # CMAKE_OSX_ARCHITECTURES defaults to the host arch (override: ARCH=...).
              make PRESET=clang-debug test CMAKE_LAUNCHER=sccache
            finally-script: |
              set -eux

              source ./venv/bin/activate
              conan remote login art "$ARTIFACTORY_USER" --password "$ARTIFACTORY_API_KEY"
              conan upload -r art -c "*" 2>&1 | grep --line-buffered "Uploading"
    uses: ./.github/workflows/junit-tests.yml
    secrets:
      test-env: |
        ARTIFACTORY_USER=${{ secrets.ARTIFACTORY_USER }}
        ARTIFACTORY_API_KEY=${{ secrets.ARTIFACTORY_API_KEY }}
      sccache-config: ${{ secrets.REGISTRY_CACHE_AUTH }}
    with:
      runs-on: ${{ matrix.runs-on }}
      container-image: ${{ matrix.container-image }}
      shell: ${{ matrix.shell || 'bash' }}
      test-command: ${{ matrix.test-command }}
      finally-script: ${{ matrix.finally-script }}
      results-path: ${{ matrix.results-path }}
      artifact-name: ${{ matrix.artifact-name }}
      sccache-key: ${{ matrix.sccache-key }}
      sccache-path: build/sccache

  linux-tests:
    name: Linux build
    if: github.repository == 'AdGuardSoftwareLimited/native-libs-common'
    runs-on: team-corelibs
    env:
      # sccache local-disk store, restored/saved across runs by the
      # registry-cache action as an OCI registry blob. SCCACHE_CACHE_SIZE caps
      # the on-disk store (and thus the per-key blob) so a force-save stays
      # bounded.
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 512M
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # sccache wraps the compilers inside the container (the binary is
      # installed by the docker stage); the runner only needs the exported
      # store and the sccache-stats.json captured in the container.
      - name: Restore sccache store
        uses: AdGuardSoftwareLimited/actions/actions/registry-cache/restore@master
        with:
          config: ${{ secrets.REGISTRY_CACHE_AUTH }}
          # Per-job prefix + conanfile.py hash so the store resets when the
          # dependency graph changes. sccache is content-addressed, so
          # source-only changes accumulate without invalidating the key.
          key: sccache-linux-${{ hashFiles('conanfile.py') }}
          path: ${{ env.SCCACHE_DIR }}

      - name: Run tests
        uses: AdGuardSoftwareLimited/actions/actions/docker-build@master
        with:
          target: results
          output: type=local,dest=build
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            CONAN_REPO_URL=${{ vars.CONAN_REPO_URL }}
            ARTIFACTORY_USER=${{ secrets.ARTIFACTORY_USER }}
            ARTIFACTORY_API_KEY=${{ secrets.ARTIFACTORY_API_KEY }}
          content: |
            # syntax=docker/dockerfile:1
            FROM ${{ env.CORELIBS_IMAGE }} AS tests

            WORKDIR /src
            COPY . .

            # A cache mount below, so the packages are neither committed to the
            # layer nor downloaded again on the next run.
            ENV CONAN_HOME=/conan

            # sccache caches the C/C++ compilations; the pinned binary is
            # installed once (this layer is not affected by CACHEBUST). The
            # store itself lives in the context (restored on the runner into
            # .sccache, carried by COPY . . below) and is exported back after
            # the build.
            ENV SCCACHE_CACHE_SIZE=512M
            RUN curl -fsSL https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz \
                | tar -xz -C /usr/local/bin --strip-components=1

            # Changes on every run so the tests are never served from the cache.
            ARG CACHEBUST

            RUN --mount=type=cache,id=conan-linux-${{ github.run_id }},target=/conan \
                --mount=type=secret,id=CONAN_REPO_URL,required=true \
                --mount=type=secret,id=ARTIFACTORY_USER \
                --mount=type=secret,id=ARTIFACTORY_API_KEY <<'END'
            set -eux

            python3 -m pip install conan --upgrade
            conan remote add --index 0 art "$(cat /run/secrets/CONAN_REPO_URL)" || true

            # The store was restored into .sccache and copied here by COPY . .;
            # CMAKE_LAUNCHER makes cmake use sccache for C/C++ compilations.
            export SCCACHE_DIR=/src/.sccache
            make PRESET=clang-debug-sanitizer test CMAKE_LAUNCHER=sccache || test_status=$?

            # Upload whatever was built, then report the test result.
            conan remote login art "$(cat /run/secrets/ARTIFACTORY_USER)" \
                --password "$(cat /run/secrets/ARTIFACTORY_API_KEY)"
            conan upload -r art -c "*" 2>&1 | grep --line-buffered "Uploading" || true

            # Capture the sccache counters where the compilations happened: the
            # runner-side daemon has no knowledge of them (and its binary may be
            # a different version). The runner reads this file to decide whether
            # to force-save the store.
            SCCACHE_DIR=/src/.sccache sccache --show-stats --stats-format=json > /src/sccache-stats.json 2>/dev/null || true

            # Drop the build outputs before the layer is committed; junit.xml,
            # which the next stage copies out, is not a build artifact.
            make PRESET=clang-debug-sanitizer clean || true
            exit ${test_status:-0}
            END

            FROM scratch AS results

            COPY --from=tests /src/cmake-build-clang-debug-sanitizer/junit.xml /junit.xml
            COPY --from=tests /src/sccache-stats.json /sccache-stats.json
            COPY --from=tests /src/.sccache /sccache

      - name: JUnit summary
        if: always()
        uses: AdGuardSoftwareLimited/actions/actions/junit-summary@master
        with:
          path: 'build/junit.xml'

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux
          path: 'build/junit.xml'
          # The report is only exported when the build succeeds, so a failing
          # test run leaves nothing to upload.
          if-no-files-found: warn

      # Print sccache counters and decide whether to force-save the store: the
      # save action skips the upload when the key already exists, so the store
      # would freeze after the first run. force=true whenever sccache wrote new
      # entries this run (the counters were captured inside the container and
      # exported with /src/sccache-stats.json), so source-only changes
      # accumulate.
      - name: sccache stats
        id: sccache-stats
        if: always()
        run: |
          cache_writes=$(grep -o '"cache_writes":[0-9]*' build/sccache-stats.json 2>/dev/null \
            | grep -o '[0-9]*' || echo 0)
          if [ "$cache_writes" -gt 0 ] 2>/dev/null; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save sccache store
        if: always()
        uses: AdGuardSoftwareLimited/actions/actions/registry-cache/save@master
        with:
          config: ${{ secrets.REGISTRY_CACHE_AUTH }}
          key: sccache-linux-${{ hashFiles('conanfile.py') }}
          path: build/sccache
          force: ${{ steps.sccache-stats.outputs.force }}

  android-build:
    name: Android build
    if: github.repository == 'AdGuardSoftwareLimited/native-libs-common'
    runs-on: team-corelibs
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.sccache
      SCCACHE_CACHE_SIZE: 512M
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # sccache wraps the compilers inside the container (the binary is
      # installed by the docker stage); the runner only needs the exported
      # store and the sccache-stats.json captured in the container.
      - name: Restore sccache store
        uses: AdGuardSoftwareLimited/actions/actions/registry-cache/restore@master
        with:
          config: ${{ secrets.REGISTRY_CACHE_AUTH }}
          # NDK clang is a different toolchain than the Linux system clang, so
          # a distinct prefix keeps the stores from colliding even though both
          # hash conanfile.py identically.
          key: sccache-android-${{ hashFiles('conanfile.py') }}
          path: ${{ env.SCCACHE_DIR }}

      - name: Build Android library
        uses: AdGuardSoftwareLimited/actions/actions/docker-build@master
        with:
          target: android-build-output
          output: type=local,dest=build
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          secrets: |
            CONAN_REPO_URL=${{ vars.CONAN_REPO_URL }}
            ARTIFACTORY_USER=${{ secrets.ARTIFACTORY_USER }}
            ARTIFACTORY_API_KEY=${{ secrets.ARTIFACTORY_API_KEY }}
          content: |
            # syntax=docker/dockerfile:1
            FROM ${{ env.CORELIBS_IMAGE }} AS android-build

            # sccache caches the NDK clang compilations; the pinned binary is
            # installed once (this layer is not affected by CACHEBUST). The
            # store lives in the context (restored on the runner into .sccache,
            # carried by COPY . . below) and is exported back after the build.
            ENV SCCACHE_CACHE_SIZE=512M
            RUN curl -fsSL https://github.com/mozilla/sccache/releases/download/v0.8.2/sccache-v0.8.2-x86_64-unknown-linux-musl.tar.gz \
                | tar -xz -C /usr/local/bin --strip-components=1

            WORKDIR /src

            # SDK components are installed with sdkmanager below, once, into the
            # cached layer. Auto-download stays on for local builds; here it is
            # off so anything missing fails by name instead of being refetched
            # on every run.
            ENV GRADLE_FLAGS="--no-daemon -Pandroid.builder.sdkDownload=false"

            # A cache mount in the build step, so the packages are neither
            # committed to the layer nor downloaded again on the next run.
            ENV CONAN_HOME=/conan

            # Only what Gradle needs to configure the project: the C++ sources
            # are copied further down, so editing them leaves this layer — and
            # the Gradle distribution and dependencies it pulls — cached.
            COPY android ./android
            COPY CMakeLists.txt ./

            RUN <<'END'
            set -eux

            python3 -m pip install conan --upgrade

            cd android/NativeLibsCommon
            touch local.properties
            echo "cmake.dir=$(dirname "$(dirname "$(which cmake)")")" >> local.properties
            # AGP downloads SDK components only from tasks that consume them,
            # and this module has no sources to compile — so the platform was
            # still being installed during assembleRelease. Fetch it directly.
            : "${ANDROID_HOME:=$ANDROID_SDK_ROOT}"
            compile_sdk=$(sed -n 's/^ *compileSdk *\([0-9][0-9]*\).*/\1/p' lib/build.gradle)
            yes | "$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")" \
                "platforms;android-${compile_sdk}"

            ./gradlew $GRADLE_FLAGS :lib:preBuild
            END

            COPY . .

            # Changes on every run, so the build below is never cached.
            ARG CACHEBUST

            RUN --mount=type=cache,id=conan-android,target=/conan \
                --mount=type=secret,id=CONAN_REPO_URL,required=true \
                --mount=type=secret,id=ARTIFACTORY_USER \
                --mount=type=secret,id=ARTIFACTORY_API_KEY <<'END'
            set -eux

            # The remote lives in the cache mount, so it is configured here
            # rather than in the layer above.
            conan remote add --index 0 art "$(cat /run/secrets/CONAN_REPO_URL)" || true

            cd android/NativeLibsCommon
            # Route NDK clang through sccache (see lib/build.gradle's USE_SCCACHE
            # gate); the store was restored into /src/.sccache by COPY . .
            export SCCACHE_DIR=/src/.sccache
            export USE_SCCACHE=1
            ./gradlew $GRADLE_FLAGS :lib:assembleRelease || build_status=$?

            conan remote login art "$(cat /run/secrets/ARTIFACTORY_USER)" \
                --password "$(cat /run/secrets/ARTIFACTORY_API_KEY)"
            conan upload -r art -c "*" 2>&1 | grep --line-buffered "Uploading" || true

            # Capture the sccache counters where the compilations happened; the
            # runner reads this file to decide whether to force-save the store.
            SCCACHE_DIR=/src/.sccache sccache --show-stats --stats-format=json > /src/sccache-stats.json 2>/dev/null || true

            # Keep the build outputs out of the committed layer.
            ./gradlew $GRADLE_FLAGS clean || true
            exit ${build_status:-0}
            END

            FROM scratch AS android-build-output

            COPY --from=android-build /src/sccache-stats.json /sccache-stats.json
            COPY --from=android-build /src/.sccache /sccache

      # Print sccache counters and decide whether to force-save the store; see
      # the linux-tests job for the rationale. The counters were captured
      # inside the container and exported with /src/sccache-stats.json.
      - name: sccache stats
        id: sccache-stats
        if: always()
        run: |
          cache_writes=$(grep -o '"cache_writes":[0-9]*' build/sccache-stats.json 2>/dev/null \
            | grep -o '[0-9]*' || echo 0)
          if [ "$cache_writes" -gt 0 ] 2>/dev/null; then
            echo "force=true" >> "$GITHUB_OUTPUT"
          else
            echo "force=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save sccache store
        if: always()
        uses: AdGuardSoftwareLimited/actions/actions/registry-cache/save@master
        with:
          config: ${{ secrets.REGISTRY_CACHE_AUTH }}
          key: sccache-android-${{ hashFiles('conanfile.py') }}
          path: build/sccache
          force: ${{ steps.sccache-stats.outputs.force }}
