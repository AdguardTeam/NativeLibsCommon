name: IPv6 check

# AG-55096: verify IPv6 is available on the ephemeral Linux agent every way CI
# reaches the network — bare host, a job `container`, `docker run`, `docker
# build`, and a container network built the way the GitHub runner builds one.
# Each path runs on two images: the base debian13-github (baseline, no IPv6
# setup) and the corelibs-builder image resolved from the KV store (expected to
# provide container IPv6). Each probe exits non-zero when outbound IPv6 is
# unreachable, so a job's status reflects real connectivity.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # Pre-pulled by the corelibs-builder image; pulled at runtime on debian13-github.
  CORELIBS_IMAGE: adguard/core-libs:2.12

jobs:
  resolve-images:
    uses: ./.github/workflows/resolve-images.yml

  host-ipv6:
    name: Host (${{ matrix.name }})
    needs: resolve-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian13-github
            image: registry.int.agrd.dev/linux/debian13-github:20260816-2356
          - name: corelibs-builder
            image: ${{ needs.resolve-images.outputs.corelibs-builder }}
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ matrix.image }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe IPv6 on host with routed prefix 2001:db8:10:300::/64
        shell: bash
        run: |
          set -eux
          # Egress interface (default IPv6 route).
          IF=$(ip -j -6 route show default | jq -r '.[0].dev // empty')
          [ -n "$IF" ] || IF=$(ip -j -6 route get 2001:4860:4860::8888 | jq -r '.[0].dev // empty')

          # Add an address from the prefix the admin routes to this agent, and
          # source outbound traffic from it.
          SRC=2001:db8:10:300::2
          ip -6 addr add "${SRC}/64" dev "$IF" || true
          ip -6 addr show dev "$IF"

          curl -6 --interface "$SRC" -sS --max-time 15 -o /dev/null \
            -w 'curl -6 (src %{local_ip}) -> HTTP %{http_code}\n' \
            https://ipv6.google.com

  container-ipv6:
    name: Container (${{ matrix.name }})
    needs: resolve-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian13-github
            image: registry.int.agrd.dev/linux/debian13-github:20260816-2356
          - name: corelibs-builder
            image: ${{ needs.resolve-images.outputs.corelibs-builder }}
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ matrix.image }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    container:
      image: adguard/core-libs:2.12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe IPv6 in container
        shell: bash
        run: sh .github/scripts/ipv6-probe.sh

  emulate-runner-network:
    name: Emulated runner network (${{ matrix.name }})
    needs: resolve-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian13-github
            image: registry.int.agrd.dev/linux/debian13-github:20260816-2356
          - name: corelibs-builder
            image: ${{ needs.resolve-images.outputs.corelibs-builder }}
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ matrix.image }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Emulate the runner's container-job network
        shell: bash
        run: sh .github/scripts/emulate-runner-network.sh

  docker-run-ipv6:
    name: Docker run (${{ matrix.name }})
    needs: resolve-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian13-github
            image: registry.int.agrd.dev/linux/debian13-github:20260816-2356
          - name: corelibs-builder
            image: ${{ needs.resolve-images.outputs.corelibs-builder }}
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ matrix.image }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe IPv6 in docker run
        shell: bash
        run: |
          set -eux
          # Mount the probe read-only and run it inside a plain container.
          docker run --rm -v "$PWD/.github/scripts:/probe:ro" \
            "$CORELIBS_IMAGE" sh /probe/ipv6-probe.sh

  docker-build-ipv6:
    name: Docker build (${{ matrix.name }})
    needs: resolve-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debian13-github
            image: registry.int.agrd.dev/linux/debian13-github:20260816-2356
          - name: corelibs-builder
            image: ${{ needs.resolve-images.outputs.corelibs-builder }}
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ matrix.image }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage probe into build context
        shell: bash
        # .dockerignore excludes .github, so copy the probe to the context root
        # where COPY can see it.
        run: cp .github/scripts/ipv6-probe.sh ipv6-probe.sh

      - name: Probe IPv6 during docker build
        uses: AdGuardSoftwareLimited/actions/actions/docker-build@master
        with:
          target: probe
          output: type=cacheonly
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          content: |
            # syntax=docker/dockerfile:1
            FROM ${{ env.CORELIBS_IMAGE }} AS probe

            COPY ipv6-probe.sh /probe.sh

            # Changes on every run so the probe below is never served from cache.
            ARG CACHEBUST

            RUN sh /probe.sh
