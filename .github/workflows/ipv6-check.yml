name: IPv6 check

# AG-55096: probe whether IPv6 is available on the ephemeral Linux agent in
# every way CI reaches the network — on the bare host, inside a job `container`,
# inside `docker run`, and inside `docker build`. All jobs only report; they
# never fail on a missing IPv6, so a single run shows every path side by side.
# The probe itself lives in .github/scripts/ipv6-probe.sh; the Docker jobs first
# run .github/scripts/enable-docker-ipv6.sh to give containers routable IPv6.

on:
  pull_request:

env:
  # Same image the containerized Linux and Android builds use.
  CORELIBS_IMAGE: adguard/core-libs:2.11

jobs:
  resolve-images:
    uses: ./.github/workflows/resolve-images.yml

  host-ipv6:
    name: IPv6 on host
    needs: resolve-images
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ needs.resolve-images.outputs.corelibs-builder }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe IPv6 on host
        shell: bash
        run: sh .github/scripts/ipv6-probe.sh

  container-ipv6:
    name: IPv6 in container
    needs: resolve-images
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ needs.resolve-images.outputs.corelibs-builder }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    container:
      image: adguard/core-libs:2.11
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe IPv6 in container
        shell: bash
        run: sh .github/scripts/ipv6-probe.sh

  docker-run-ipv6:
    name: IPv6 in docker run
    needs: resolve-images
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ needs.resolve-images.outputs.corelibs-builder }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable IPv6 in Docker
        shell: bash
        run: sh .github/scripts/enable-docker-ipv6.sh

      - name: Probe IPv6 in docker run
        shell: bash
        run: |
          set -eux
          # Mount the probe read-only and run it inside a plain container.
          docker run --rm -v "$PWD/.github/scripts:/probe:ro" \
            "$CORELIBS_IMAGE" sh /probe/ipv6-probe.sh

  docker-build-ipv6:
    name: IPv6 in docker build
    needs: resolve-images
    runs-on:
      - ephemeral
      - ephemeral-linux
      - ${{ needs.resolve-images.outputs.corelibs-builder }}
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe IPv6 during docker build
        shell: bash
        env:
          DOCKER_BUILDKIT: '1'
        run: |
          set -eux

          # BuildKit's default build network has no IPv6, and the shared
          # docker-build action exposes no entitlement flag — so build here
          # directly, granting network.host so the RUN uses the host stack,
          # the only place with working IPv6 on this agent.
          #
          # .dockerignore excludes .github, so stage the probe at the context
          # root where COPY can see it.
          cp .github/scripts/ipv6-probe.sh ipv6-probe.sh

          cat > Dockerfile.ipv6 <<'DOCKERFILE'
          # syntax=docker/dockerfile:1
          FROM adguard/core-libs:2.11 AS probe
          COPY ipv6-probe.sh /probe.sh
          # Changes every run so the probe is never served from cache.
          ARG CACHEBUST
          RUN --network=host sh /probe.sh
          DOCKERFILE

          docker build --allow network.host --progress plain \
            --target probe --output type=cacheonly \
            --build-arg CACHEBUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            -f Dockerfile.ipv6 .
