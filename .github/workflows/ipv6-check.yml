name: IPv6 check

# AG-55096: probe whether IPv6 is available on the ephemeral Linux agent in the
# two ways CI actually runs Linux jobs — inside a job `container`, and inside a
# `docker build`. Both jobs only report; they never fail on a missing IPv6, so a
# single run shows the result of both paths side by side.

on:
  pull_request:

env:
  # Same image the containerized Linux and Android builds use.
  CORELIBS_IMAGE: adguard/core-libs:2.12

jobs:
  resolve-images:
    uses: ./.github/workflows/resolve-images.yml

  container-ipv6:
    name: IPv6 in container
    needs: resolve-images
    runs-on: '["ephemeral","ephemeral-linux","${{ needs.resolve-images.outputs.corelibs-builder }}","ephemeral-limit-memory-6144","ephemeral-limit-cpu-4"]'
    container:
      image: adguard/core-libs:2.12
    steps:
      - name: Probe IPv6
        shell: bash
        run: |
          set -u

          section() { printf '\n=== %s ===\n' "$1"; }
          have() { command -v "$1" >/dev/null 2>&1; }

          section "Kernel IPv6 support"
          if [ -f /proc/net/if_inet6 ]; then
            echo "PASS: /proc/net/if_inet6 present (kernel has IPv6)"
          else
            echo "FAIL: /proc/net/if_inet6 missing (kernel IPv6 disabled)"
          fi

          section "IPv6 addresses (/proc/net/if_inet6)"
          # Fields: address ifindex prefixlen scope flags ifname.
          # scope 00 = global, 10 = host (loopback), 20 = link-local.
          cat /proc/net/if_inet6 2>/dev/null || echo "(none)"
          global6=$(awk '$4 == "00"' /proc/net/if_inet6 2>/dev/null | wc -l | tr -d ' ')
          echo "Global-scope IPv6 addresses: ${global6}"

          section "ip -6 addr"
          if have ip; then ip -6 addr show || true; else echo "(ip not installed)"; fi

          section "Outbound IPv6 connectivity"
          # A missing route or firewall makes this the real signal, so run it
          # even when a global address exists. Report only, never fail.
          if have curl; then
            code=$(curl -6 -sS --max-time 15 -o /dev/null \
                   -w '%{http_code}' https://ipv6.google.com 2>&1) \
              && echo "PASS: curl -6 https://ipv6.google.com -> HTTP ${code}" \
              || echo "FAIL: curl -6 could not reach ipv6.google.com (${code})"
          elif have ping6 || have ping; then
            p="ping6"; have ping6 || p="ping -6"
            $p -c 2 -W 5 ipv6.google.com \
              && echo "PASS: ${p} reached ipv6.google.com" \
              || echo "FAIL: ${p} could not reach ipv6.google.com"
          else
            echo "SKIP: neither curl nor ping available"
          fi

          echo
          echo "IPv6 probe finished (report-only)."

  docker-build-ipv6:
    name: IPv6 in docker build
    needs: resolve-images
    runs-on: '["ephemeral","ephemeral-linux","${{ needs.resolve-images.outputs.corelibs-builder }}","ephemeral-limit-memory-6144","ephemeral-limit-cpu-4"]'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe IPv6 during docker build
        uses: AdGuardSoftwareLimited/actions/actions/docker-build@master
        with:
          target: probe
          output: type=cacheonly
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          content: |
            # syntax=docker/dockerfile:1
            FROM ${{ env.CORELIBS_IMAGE }} AS probe

            # Changes on every run so the probe below is never served from cache.
            ARG CACHEBUST

            RUN <<'END'
            set -u

            section() { printf '\n=== %s ===\n' "$1"; }
            have() { command -v "$1" >/dev/null 2>&1; }

            section "Kernel IPv6 support"
            if [ -f /proc/net/if_inet6 ]; then
              echo "PASS: /proc/net/if_inet6 present (kernel has IPv6)"
            else
              echo "FAIL: /proc/net/if_inet6 missing (kernel IPv6 disabled)"
            fi

            section "IPv6 addresses (/proc/net/if_inet6)"
            cat /proc/net/if_inet6 2>/dev/null || echo "(none)"
            global6=$(awk '$4 == "00"' /proc/net/if_inet6 2>/dev/null | wc -l | tr -d ' ')
            echo "Global-scope IPv6 addresses: ${global6}"

            section "ip -6 addr"
            if have ip; then ip -6 addr show || true; else echo "(ip not installed)"; fi

            section "Outbound IPv6 connectivity"
            if have curl; then
              code=$(curl -6 -sS --max-time 15 -o /dev/null \
                     -w '%{http_code}' https://ipv6.google.com 2>&1) \
                && echo "PASS: curl -6 https://ipv6.google.com -> HTTP ${code}" \
                || echo "FAIL: curl -6 could not reach ipv6.google.com (${code})"
            else
              echo "SKIP: curl not available"
            fi

            echo
            echo "IPv6 probe finished (report-only)."
            END
