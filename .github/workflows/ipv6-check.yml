name: IPv6 check

# AG-55096: probe whether IPv6 is available on the ephemeral Linux agent in
# every way CI reaches the network — on the bare host, inside a job `container`,
# inside `docker run`, and inside `docker build`. All jobs only report; they
# never fail on a missing IPv6, so a single run shows every path side by side.
# The probe lives in .github/scripts/ipv6-probe.sh. Container IPv6 is provided
# by the corelibs-builder image itself now, so the workflow does no setup.

on:
  pull_request:

env:
  # Pre-pulled by the corelibs-builder image below.
  CORELIBS_IMAGE: adguard/core-libs:2.12

jobs:
  runner-startup:
    name: Investigate runner startup
    runs-on:
      - ephemeral
      - ephemeral-linux
      - registry.int.agrd.dev/linux/corelibs-builder:20260818-2048
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Investigate how the VM agent starts actions-runner
        shell: bash
        run: sh .github/scripts/investigate-runner-startup.sh

      - name: Investigate docker network create wrapper feasibility
        shell: bash
        run: sh .github/scripts/investigate-docker-network.sh

  host-ipv6:
    name: IPv6 on host
    runs-on:
      - ephemeral
      - ephemeral-linux
      - registry.int.agrd.dev/linux/corelibs-builder:20260818-2048
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe IPv6 on host
        shell: bash
        run: sh .github/scripts/ipv6-probe.sh

  container-ipv6:
    name: IPv6 in container
    runs-on:
      - ephemeral
      - ephemeral-linux
      - registry.int.agrd.dev/linux/corelibs-builder:20260818-2048
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    container:
      image: adguard/core-libs:2.12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe IPv6 in container
        shell: bash
        run: sh .github/scripts/ipv6-probe.sh

  emulate-runner-network:
    name: IPv6 in emulated runner network
    runs-on:
      - ephemeral
      - ephemeral-linux
      - registry.int.agrd.dev/linux/corelibs-builder:20260818-2048
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Emulate the runner's container-job network
        shell: bash
        run: sh .github/scripts/emulate-runner-network.sh

  docker-run-ipv6:
    name: IPv6 in docker run
    runs-on:
      - ephemeral
      - ephemeral-linux
      - registry.int.agrd.dev/linux/corelibs-builder:20260818-2048
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Probe IPv6 in docker run
        shell: bash
        run: |
          set -eux
          # Mount the probe read-only and run it inside a plain container.
          docker run --rm -v "$PWD/.github/scripts:/probe:ro" \
            "$CORELIBS_IMAGE" sh /probe/ipv6-probe.sh

  docker-build-ipv6:
    name: IPv6 in docker build
    runs-on:
      - ephemeral
      - ephemeral-linux
      - registry.int.agrd.dev/linux/corelibs-builder:20260818-2048
      - ephemeral-limit-memory-6144
      - ephemeral-limit-cpu-4
      - ephemeral-run-id-${{ github.run_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Stage probe into build context
        shell: bash
        # .dockerignore excludes .github, so copy the probe to the context root
        # where COPY can see it.
        run: cp .github/scripts/ipv6-probe.sh ipv6-probe.sh

      - name: Probe IPv6 during docker build
        uses: AdGuardSoftwareLimited/actions/actions/docker-build@master
        with:
          target: probe
          output: type=cacheonly
          build-args: |
            CACHEBUST=${{ github.run_id }}-${{ github.run_attempt }}
          content: |
            # syntax=docker/dockerfile:1
            FROM ${{ env.CORELIBS_IMAGE }} AS probe

            COPY ipv6-probe.sh /probe.sh

            # Changes on every run so the probe below is never served from cache.
            ARG CACHEBUST

            RUN sh /probe.sh
